<div class="data-table">
  <table mat-table [dataSource]="dataSource">
    <ng-container *ngFor="let column of columns" [matColumnDef]="column.key">
      <th mat-header-cell *matHeaderCellDef [class.data-table__cell--end]="column.align === 'end'">
        {{ column.header }}
      </th>
      <td mat-cell *matCellDef="let row" [class.data-table__cell--end]="column.align === 'end'">
        <span *ngIf="chipTone(row, column) as tone; else plainCell"
              class="chip"
              [ngClass]="'chip--' + tone">
          {{ cellValue(row, column) }}
        </span>
        <ng-template #plainCell>{{ cellValue(row, column) }}</ng-template>
      </td>
    </ng-container>

    <ng-container *ngIf="actions.length > 0" [matColumnDef]="actionsColumnKey">
      <th mat-header-cell *matHeaderCellDef aria-label="Actions"></th>
      <td mat-cell *matCellDef="let row">
        <button
          *ngFor="let action of actions"
          mat-icon-button
          [color]="action.color || undefined"
          [attr.title]="action.tooltip || null"
          [attr.aria-label]="action.tooltip || action.key"
          (click)="onActionClick($event, action.key, row)">
          <mat-icon>{{ action.icon }}</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="rowClick.emit(row)"></tr>
  </table>

  <div class="data-table__empty" *ngIf="rows.length === 0">
    <mat-icon>inbox</mat-icon>
    <span>No records to display.</span>
  </div>

  <mat-paginator [pageSizeOptions]="pageSizeOptions" [pageSize]="pageSize" showFirstLastButtons></mat-paginator>
</div>
