<h2 mat-dialog-title>Document Absence Reason</h2>

<mat-dialog-content class="dialog-content">
  <div class="meta-info">
    <p><strong>Employee:</strong> {{ data.staffName }}</p>
    <p><strong>Slot:</strong> {{ data.slotName }}</p>
    <p><strong>Date:</strong> {{ data.date }}</p>
  </div>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Reason for Absence</mat-label>
    <textarea
      matInput
      [(ngModel)]="reason"
      rows="4"
      placeholder="Enter the official reason for missing this mandatory slot (e.g. Sick Leave, Approved Emergency)..."
      maxlength="500"
      required>
    </textarea>
    <mat-hint align="end">{{ reason.length }}/500</mat-hint>
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-flat-button color="primary" [disabled]="!reason.trim()" (click)="onSave()">Save Reason</button>
</mat-dialog-actions>
