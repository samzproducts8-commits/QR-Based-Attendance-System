<div class="staff-profile" *ngIf="staff">
  <mat-card>
    <img *ngIf="photoUrl" [src]="photoUrl" alt="{{ staff.fullName }}" class="staff-profile__photo" />

    <mat-card-header>
      <mat-card-title>{{ staff.fullName }}</mat-card-title>
      <mat-card-subtitle>{{ staff.uniqueCode }} · {{ staff.department }}</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <p><strong>Job Title:</strong> {{ staff.jobTitle }}</p>
      <p><strong>Status:</strong> {{ staff.status === 1 ? 'Active' : 'Inactive' }}</p>
    </mat-card-content>

    <mat-card-actions>
      <button mat-button color="warn" (click)="deactivate()" *ngIf="staff.status === 1">
        Deactivate
      </button>
    </mat-card-actions>
  </mat-card>
</div>

<mat-progress-spinner *ngIf="loading" mode="indeterminate" diameter="32"></mat-progress-spinner>
