<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="dafBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d64f2" />
      <stop offset="100%" stop-color="#0f4c92" />
    </linearGradient>
    <linearGradient id="techBlock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f4c92" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Logo Graphics Group -->
  <g transform="translate(45, 20)" filter="url(#subtleGlow)">
    <!-- Letter D -->
    <path d="M 10 20 H 45 C 68 20 80 35 80 57 C 80 79 68 94 45 94 H 10 Z M 32 38 V 76 H 43 C 55 76 60 69 60 57 C 60 45 55 38 43 38 Z" fill="url(#dafBlue)" />

    <!-- Letter A with Grey Triangle -->
    <path d="M 88 94 L 118 20 H 138 L 168 94 H 146 L 140 76 H 116 L 110 94 Z M 121 60 H 135 L 128 38 Z" fill="url(#dafBlue)" />
    <!-- Grey Inner Triangle in A -->
    <polygon points="121,62 135,62 128,42" fill="#718096" />

    <!-- Letter F -->
    <path d="M 174 20 H 222 V 38 H 194 V 50 H 218 V 66 H 194 V 94 H 174 Z" fill="url(#dafBlue)" />

    <!-- Vertical Grey Block with "Tech" -->
    <g transform="translate(230, 16)">
      <rect x="0" y="0" width="48" height="85" rx="3" fill="url(#techBlock)" />
      <!-- Vertical text "Tech" -->
      <text x="24" y="72" transform="rotate(-90 24 72)" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="28" letter-spacing="1">Tech</text>
    </g>

    <!-- Text "social" -->
    <g transform="translate(290, 48)">
      <text x="0" y="0" fill="#2563eb" font-family="'Courier New', Courier, monospace, sans-serif" font-weight="600" font-size="36" letter-spacing="-1">social</text>
      <!-- Registered Trademark ® -->
      <text x="122" y="-14" fill="#2563eb" font-family="sans-serif" font-size="14" font-weight="bold">®</text>
      
      <!-- Subtext line and "ICT solution plc." -->
      <line x1="-5" y1="24" x2="55" y2="24" stroke="#94a3b8" stroke-width="2.5" />
      <text x="62" y="27" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="15" letter-spacing="0.5">ICT solution plc.</text>
    </g>
  </g>

  <!-- Full Company Name Subtitle -->
  <text x="300" y="180" text-anchor="middle" fill="#0f172a" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-weight="700" font-size="23" letter-spacing="0.2">DAFTech Social ICT Solutions PLC</text>
</svg>
